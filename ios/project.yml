name: Banditboard
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.17.0"
    BUNDLE_BASE: dev.clawdboard.banditboard.preview
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Banditboard:
    type: application
    platform: iOS
    sources: [Banditboard, Shared]
    entitlements:
      path: Banditboard/Banditboard.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)dev.clawdboard.banditboard.shared]
    info:
      path: Banditboard/Info.plist
      properties:
        CFBundleDisplayName: Banditboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [pt-BR, en]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: dev.clawdboard.banditboard
            CFBundleURLSchemes: [banditboard]
        NSLocalNetworkUsageDescription: O Banditboard busca o uso do Claude Code no seu PC ou Mac pela rede de casa.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dev.clawdboard.banditboard.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BanditboardWidget
      - target: BanditboardWatch
  BanditboardWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/BanditboardWidget.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)dev.clawdboard.banditboard.shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Banditboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [pt-BR, en]
        CFBundleAllowMixedLocalizations: true
        NSLocalNetworkUsageDescription: O Banditboard busca o uso do Claude Code no seu PC ou Mac pela rede de casa.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE).widget
  BanditboardWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    entitlements:
      path: Watch/BanditboardWatch.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)dev.clawdboard.banditboard.shared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Banditboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [pt-BR, en]
        CFBundleAllowMixedLocalizations: true
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_BASE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    dependencies:
      - target: BanditboardWatchWidget
  BanditboardWatchWidget:
    type: app-extension
    platform: watchOS
    sources: [WatchWidget, Shared]
    entitlements:
      path: WatchWidget/BanditboardWatchWidget.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)dev.clawdboard.banditboard.shared]
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Banditboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [pt-BR, en]
        CFBundleAllowMixedLocalizations: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_BASE).watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
